name: Release Node UI

on:
  push:
    tags:
      - "node-ui-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_target: ""
          - platform: windows-latest
            args: ""
            rust_target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libfuse2: linuxdeploy is itself an AppImage and needs FUSE2 to
          # self-mount at build time. The ubuntu-22.04 GitHub runner stopped
          # pre-installing libfuse2; without it the AppImage bundling step
          # exits with "failed to run linuxdeploy" and no stderr.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm
        # Pin to v9: pnpm 10 added strict-build-scripts which rejects
        # post-install scripts (esbuild, @tailwindcss/oxide) by default
        # and ERR_PNPM_IGNORED_BUILDS exits 1 even with
        # `pnpm.onlyBuiltDependencies` declared in package.json.
        # Stay on v9 until we fully migrate to v10 config.
        run: npm install -g pnpm@9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Wait for the matching @synapseia-network/node version to be published
      # on npm before bundling. node-ui and node share the same version per
      # release flow (CLAUDE.md "Version sync rule"), and node-ui-vX.Y.Z is
      # often tagged minutes after node-vX.Y.Z. npm registry propagation can
      # lag a few minutes, so if we npm-install without waiting we risk
      # shipping the previous CLI version inside the new .dmg/.msi/.AppImage.
      - name: Wait for @synapseia-network/node@$VERSION on npm
        shell: bash
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          echo "Waiting for @synapseia-network/node@$VERSION on npm registry..."
          for i in $(seq 1 20); do
            if npm view "@synapseia-network/node@$VERSION" version >/dev/null 2>&1; then
              echo "Found @synapseia-network/node@$VERSION on attempt $i"
              exit 0
            fi
            echo "[$i/20] not yet propagated; sleeping 30s"
            sleep 30
          done
          echo "ERROR: @synapseia-network/node@$VERSION not on npm after 10 minutes."
          echo "Push node-v$VERSION first, or wait for its publish workflow to finish."
          exit 1

      # Bundle the @synapseia-network/node CLI INSIDE the Tauri app so first-
      # launch on a clean machine works WITHOUT npm / network. The npm-install
      # path remains preferred (lets the CLI auto-update without re-downloading
      # the desktop app) — this is the safety-net fallback. Runs per-platform
      # so `node_modules` ships with the right platform-specific prebuilds
      # (usearch .node binaries, etc.). We install the published CLI into a
      # scratch dir and copy its dist + node_modules into src-tauri/resources.
      # Pinned to the node-ui version (synced per release flow) to avoid
      # registry-propagation races that would ship a stale CLI in a new app.
      - name: Bundle @synapseia-network/node into Tauri resources
        shell: bash
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          STAGE="$RUNNER_TEMP/syn-cli-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cd "$STAGE"
          # Write scratch package.json with overrides BEFORE install so
          # npm can apply them. Two overrides matter at install time:
          #
          #  1. `rpc-websockets > uuid: 8.3.2` — rpc-websockets's
          #     CJS bundle does `require('uuid')`. Newer uuid (10+) is
          #     ESM-only, so the nested resolution would crash at
          #     runtime with ERR_REQUIRE_ESM. Pinning the nested uuid
          #     to 8.x (the last CJS-only release) keeps rpc-websockets
          #     loadable; the hoisted top-level uuid stays at the
          #     current major so other consumers (e.g. langgraph, which
          #     needs `v6`) still work.
          cat > package.json <<JSON
          {
            "name": "syn-cli-bundle-stage",
            "version": "0.0.0",
            "private": true,
            "overrides": {
              "rpc-websockets": { "uuid": "8.3.2" }
            },
            "dependencies": { "@synapseia-network/node": "$VERSION" }
          }
          JSON
          # Use --ignore-scripts so the CLI's postinstall (patch-package)
          # doesn't run with cwd = installed-package dir. npm hoists
          # @libp2p/utils to $STAGE/node_modules/ (not nested under the
          # CLI), and patch-package run from the package dir can't see
          # the hoisted dep — fails with "Patch file found for package
          # utils which is not present at node_modules/@libp2p/utils".
          # We re-run patch-package manually from the scratch root
          # below, where it CAN resolve the hoisted layout.
          npm install --omit=dev --no-audit --no-fund --ignore-scripts
          # Apply patches from the SCRATCH ROOT so patch-package can
          # resolve hoisted deps. patch-dir points at the installed
          # package's patches/ folder.
          PATCH_DIR="node_modules/@synapseia-network/node/patches"
          if [ -d "$PATCH_DIR" ] && [ -n "$(ls -A "$PATCH_DIR" 2>/dev/null)" ]; then
            echo "Applying patches from $PATCH_DIR"
            npx --yes patch-package@8 --patch-dir "$PATCH_DIR" --error-on-fail
          else
            echo "No patches to apply (patch-dir empty or missing) — continuing."
          fi
          CLI_DIR="$STAGE/node_modules/@synapseia-network/node"
          DEST="$GITHUB_WORKSPACE/src-tauri/resources/cli"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$CLI_DIR/dist" "$DEST/"
          cp "$CLI_DIR/package.json" "$DEST/"
          # Move the CLI's siblings under node_modules in too (its own deps).
          # npm hoists dependencies to the top-level node_modules of the
          # scratch project, so we copy the whole tree minus the CLI's own
          # entry (the dist/package.json from there is already in DEST).
          mkdir -p "$DEST/node_modules"
          # Copy every package except the CLI's own directory.
          for entry in "$STAGE/node_modules"/*; do
            name="$(basename "$entry")"
            if [ "$name" = "@synapseia-network" ]; then
              # Copy only siblings of `node` under the scope, plus node's
              # own nested node_modules (its private deps).
              for scoped in "$entry"/*; do
                sname="$(basename "$scoped")"
                if [ "$sname" = "node" ]; then
                  if [ -d "$scoped/node_modules" ]; then
                    mkdir -p "$DEST/node_modules/@synapseia-network/node"
                    cp -R "$scoped/node_modules" "$DEST/node_modules/@synapseia-network/node/"
                  fi
                else
                  mkdir -p "$DEST/node_modules/@synapseia-network"
                  cp -R "$scoped" "$DEST/node_modules/@synapseia-network/"
                fi
              done
            else
              cp -R "$entry" "$DEST/node_modules/"
            fi
          done
          if [ -d "$CLI_DIR/patches" ]; then
            cp -R "$CLI_DIR/patches" "$DEST/"
          else
            mkdir -p "$DEST/patches"
          fi
          echo "Bundled CLI size:"
          du -sh "$DEST" || true

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Synapseia Node ${{ github.ref_name }}"
          releaseBody: "See the [CHANGELOG](https://github.com/erscoder/synapseia-node-ui/blob/main/CHANGELOG.md) for details."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
