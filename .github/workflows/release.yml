name: Release Node UI

on:
  push:
    tags:
      - "node-ui-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_target: ""
          - platform: windows-latest
            args: ""
            rust_target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libfuse2: linuxdeploy is itself an AppImage and needs FUSE2 to
          # self-mount at build time. The ubuntu-22.04 GitHub runner stopped
          # pre-installing libfuse2; without it the AppImage bundling step
          # exits with "failed to run linuxdeploy" and no stderr.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm
        # Pin to v9: pnpm 10 added strict-build-scripts which rejects
        # post-install scripts (esbuild, @tailwindcss/oxide) by default
        # and ERR_PNPM_IGNORED_BUILDS exits 1 even with
        # `pnpm.onlyBuiltDependencies` declared in package.json.
        # Stay on v9 until we fully migrate to v10 config.
        run: npm install -g pnpm@9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Wait for the matching @synapseia-network/node version to be published
      # on npm before bundling. node-ui and node share the same version per
      # release flow (CLAUDE.md "Version sync rule"), and node-ui-vX.Y.Z is
      # often tagged minutes after node-vX.Y.Z. npm registry propagation can
      # lag a few minutes, so if we npm-install without waiting we risk
      # shipping the previous CLI version inside the new .dmg/.msi/.AppImage.
      - name: Wait for @synapseia-network/node@$VERSION on npm
        shell: bash
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          echo "Waiting for @synapseia-network/node@$VERSION on npm registry..."
          for i in $(seq 1 20); do
            if npm view "@synapseia-network/node@$VERSION" version >/dev/null 2>&1; then
              echo "Found @synapseia-network/node@$VERSION on attempt $i"
              exit 0
            fi
            echo "[$i/20] not yet propagated; sleeping 30s"
            sleep 30
          done
          echo "ERROR: @synapseia-network/node@$VERSION not on npm after 10 minutes."
          echo "Push node-v$VERSION first, or wait for its publish workflow to finish."
          exit 1

      # Bundle the @synapseia-network/node CLI INSIDE the Tauri app so first-
      # launch on a clean machine works WITHOUT npm / network. The npm-install
      # path remains preferred (lets the CLI auto-update without re-downloading
      # the desktop app) — this is the safety-net fallback. Runs per-platform
      # so the `usearch` native dep ships with the right platform-specific
      # prebuilds (.node binaries).
      #
      # Single-bundle layout (post 0.8.20): the CLI's `dist/index.js` is a
      # tsup-bundled ~14MB ESM file with every JS dep inlined. We ship only:
      #   - `dist/`              (bundled CLI + sourcemap + scripts/)
      #   - `package.json`       (Rust locator does substring check on `name`)
      #   - `node_modules/{usearch,bindings,node-gyp-build,node-addon-api,file-uri-to-path}/`
      #     (native chain — usearch's `import 'bindings'` etc. at load time)
      # Skipping the rest of `node_modules` drops the tarball from ~200MB
      # to ~15MB and the extracted footprint from ~365MB to ~70MB.
      - name: Bundle @synapseia-network/node into Tauri resources
        shell: bash
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          NPM_STAGE="$RUNNER_TEMP/syn-cli-npm-stage"
          rm -rf "$NPM_STAGE"
          mkdir -p "$NPM_STAGE"
          cd "$NPM_STAGE"
          # Scratch package.json with the rpc-websockets > uuid override.
          # rpc-websockets's CJS bundle does `require('uuid')`. Newer uuid
          # (10+) is ESM-only and would crash with ERR_REQUIRE_ESM at
          # runtime. Pinning the nested uuid to 8.x (last CJS-only
          # release) keeps rpc-websockets loadable; the hoisted top-level
          # uuid stays current for langgraph (needs `v6`).
          cat > package.json <<JSON
          {
            "name": "syn-cli-bundle-stage",
            "version": "0.0.0",
            "private": true,
            "overrides": {
              "rpc-websockets": { "uuid": "8.3.2" }
            },
            "dependencies": { "@synapseia-network/node": "$VERSION" }
          }
          JSON
          # --ignore-scripts so the CLI's postinstall (patch-package) doesn't
          # run with cwd = installed-package dir. npm hoists @libp2p/utils
          # to $NPM_STAGE/node_modules/ (not nested under the CLI), and
          # patch-package run from the package dir can't see the hoisted
          # dep. We re-run patch-package manually from the scratch root
          # below where the hoisted layout is visible.
          #
          # Once the published CLI's `dist/index.js` is itself pre-bundled
          # with the patched libp2p source inlined (post 0.8.20), this
          # step is a no-op — but keep it until we explicitly drop the
          # patches/ directory from the published tarball.
          npm install --omit=dev --no-audit --no-fund --ignore-scripts
          PATCH_DIR="node_modules/@synapseia-network/node/patches"
          if [ -d "$PATCH_DIR" ] && [ -n "$(ls -A "$PATCH_DIR" 2>/dev/null)" ]; then
            echo "Applying patches from $PATCH_DIR"
            npx --yes patch-package@8 --patch-dir "$PATCH_DIR" --error-on-fail
          else
            echo "No patches to apply (patch-dir empty or missing) — continuing."
          fi
          CLI_DIR="$NPM_STAGE/node_modules/@synapseia-network/node"
          STAGE="$GITHUB_WORKSPACE/src-tauri/resources/.cli-bundle-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/node_modules"
          # The bundled CLI.
          cp -R "$CLI_DIR/dist" "$STAGE/"
          cp "$CLI_DIR/package.json" "$STAGE/"
          # Native runtime chain. usearch loads `.node` binaries via
          # dlopen and is `external` in the tsup config; the chain
          # below is its load-time JS deps. Missing any one crashes the
          # first KgShardHnswSearcher init with `Cannot find package`.
          for dep in usearch bindings node-gyp-build node-addon-api file-uri-to-path; do
            SRC="$NPM_STAGE/node_modules/$dep"
            if [ ! -d "$SRC" ]; then
              echo "ERROR: native dep '$dep' missing at $SRC after npm install"
              exit 1
            fi
            cp -R "$SRC" "$STAGE/node_modules/"
          done
          echo "Bundled CLI size (loose tree, pre-tar):"
          du -sh "$STAGE" || true
          # Tar the materialized bundle into ONE opaque archive. Linux
          # AppImage's linuxdeploy bailed silently when walking the old
          # ~10k-file node_modules tree; with the slimmer single-bundle
          # layout the file count is small enough that linuxdeploy
          # would handle it, but the tarball indirection keeps a stable
          # extraction model + a deterministic size gate in the Rust
          # locator (`MIN_REAL_BUNDLE_BYTES`).
          TARBALL_DIR="$GITHUB_WORKSPACE/src-tauri/resources"
          mkdir -p "$TARBALL_DIR"
          rm -f "$TARBALL_DIR/cli-bundle.tar.gz"
          # cd into the output dir + use a RELATIVE output path so tar
          # never sees a leading `D:\...` on Windows. With an absolute
          # path the Windows job otherwise dies with "Cannot connect to
          # D: resolve failed" because tar parses `D:` as rcp host:path.
          # macOS BSD tar doesn't support --force-local, so a relative
          # path is the portable fix.
          ( cd "$TARBALL_DIR" && tar -czf cli-bundle.tar.gz -C "$STAGE" . )
          rm -rf "$STAGE"
          rm -rf "$NPM_STAGE"
          echo "Bundled CLI tarball size:"
          du -sh "$TARBALL" || true

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Synapseia Node ${{ github.ref_name }}"
          releaseBody: "See the [CHANGELOG](https://github.com/erscoder/synapseia-node-ui/blob/main/CHANGELOG.md) for details."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
