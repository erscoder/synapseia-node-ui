[package]
name = "synapseia-node-ui"
version = "0.8.97"
description = "Synapseia Node Desktop UI"
authors = ["Synapseia"]
edition = "2021"
license-file = "../LICENSE"

[lib]
name = "synapseia_node_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "rt-multi-thread", "macros", "time"] }
log = "0.4"
dirs = "5"
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
libc = "0.2"
# F-node-ui-005 (P36): scrub the wallet-password bytes when the cached
# field is reassigned or the NodeProcess drops. Wrapper-only, no runtime
# alloc cost.
zeroize = { version = "1.8", features = ["zeroize_derive"] }
# F-node-ui-004 (P10): per-spawn nonce for the [SELF_UPDATE_RESTART]
# stdout marker. `getrandom` was already in the transitive graph; pinning
# it as a direct dep keeps the supply-chain audit explicit.
getrandom = "0.2"
# F-node-ui-011 (P7): pure-Rust archive extraction. Per-entry path
# validation rejects "../" / absolute paths so a malicious tarball
# cannot escape the staging dir. The shell-out to `tar -xf` did not
# enforce any path guards. `tar` + `flate2` already in the transitive
# graph (sha2/reqwest deps); pinning them direct.
tar = "0.4"
flate2 = "1"
# Linux Node tarballs are .tar.xz. `xz2` with the `static` feature
# bundles liblzma so the build is self-contained on every platform we
# ship for.
xz2 = { version = "0.1", features = ["static"] }
# Windows Node tarballs are .zip.
zip = { version = "2", default-features = false, features = ["deflate"] }
# F-node-ui-016 (P29): strict 32-byte base58 decode for the wallet
# pubkey sentinel. The old length-range + charset check accepted any
# 32–44-character base58 string, which is sloppy enough that a
# malformed CLI log line could surface as a "wallet" in the UI. The
# `bs58` crate is already in the workspace via the node CLI; pinning it
# here keeps the supply-chain audit explicit (cf. P13 dual-decl rule).
bs58 = "0.5"
# F-node-ui-012 (P10): persist the LLM API key in the OS keyring
# (macOS Keychain, Linux Secret Service, Windows Credential Locker).
# Falls back to a plaintext field in ui-settings.json when the keyring
# is unavailable so a headless / CI environment is not blocked. Other
# UI settings (model slug, RPC URL, node name) stay in plain JSON —
# they are not secrets.
keyring = "3"

[dev-dependencies]
tempfile = "3"
