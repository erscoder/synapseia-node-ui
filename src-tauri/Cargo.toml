[package]
name = "synapseia-node-ui"
version = "0.8.86"
description = "Synapseia Node Desktop UI"
authors = ["Synapseia"]
edition = "2021"
license-file = "../LICENSE"

[lib]
name = "synapseia_node_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "rt-multi-thread", "macros", "time"] }
log = "0.4"
dirs = "5"
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
libc = "0.2"
# F-node-ui-005 (P36): scrub the wallet-password bytes when the cached
# field is reassigned or the NodeProcess drops. Wrapper-only, no runtime
# alloc cost.
zeroize = { version = "1.8", features = ["zeroize_derive"] }
# F-node-ui-004 (P10): per-spawn nonce for the [SELF_UPDATE_RESTART]
# stdout marker. `getrandom` was already in the transitive graph; pinning
# it as a direct dep keeps the supply-chain audit explicit.
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"
